<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Score Chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 1rem; font-family: 'Inter', sans-serif; background: #F0F2F5; box-sizing: border-box; }
    .chart-wrap { background: #fff; border-radius: 4px; border: 1px solid #dde0e5; padding: 1.5rem; max-width: 700px; margin: 0 auto; }
    .metric-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 1.5rem; }
    .metric { background: #F0F2F5; border-radius: 4px; padding: 0.875rem 1rem; flex: 1; min-width: 100px; }
    .metric-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: #5A6A82; margin-bottom: 4px; }
    .metric-value { font-size: 1.4rem; font-weight: 600; color: #1B2A4A; }
    .legend { display: flex; gap: 1.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: #5A6A82; }
    .legend-solid { width: 20px; height: 2px; border-radius: 2px; background: #2a78d6; }
    .legend-dashed { width: 20px; height: 0; border-top: 2px dashed #e34948; }
    figcaption { font-size: 0.75rem; color: #5A6A82; margin-top: 0.875rem; line-height: 1.5; }
  </style>
</head>
<body>
<figure class="chart-wrap">
  <div class="metric-row" aria-label="Key metrics">
    <div class="metric">
      <div class="metric-label">Starting score</div>
      <div class="metric-value">87.0</div>
    </div>
    <div class="metric">
      <div class="metric-label">Industry benchmark</div>
      <div class="metric-value">83.1</div>
    </div>
    <div class="metric">
      <div class="metric-label">Score achieved</div>
      <div class="metric-value">93.8</div>
    </div>
    <div class="metric">
      <div class="metric-label">Above benchmark</div>
      <div class="metric-value">+10.7</div>
    </div>
  </div>

  <div class="legend" aria-hidden="true">
    <div class="legend-item"><div class="legend-solid"></div>UChicago SEO score</div>
    <div class="legend-item"><div class="legend-dashed"></div>Education benchmark (83.1)</div>
  </div>

  <div style="position: relative; width: 100%; height: 260px;">
    <canvas id="seoChart" role="img" aria-label="Line chart showing SEO score rising from 87.0 at baseline to 93.8 at the final measurement, consistently above the education industry benchmark of 83.1 shown as a dashed red line.">SEO score improved from 87.0 to 93.8 over six reporting periods, surpassing the education industry benchmark of 83.1 by over 10 points.</canvas>
  </div>

  <figcaption>SEO score trajectory measured via BrightEdge across six reporting periods. Education industry benchmark: 83.1.</figcaption>
</figure>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
new Chart(document.getElementById('seoChart'), {
  type: 'line',
  data: {
    labels: ['Baseline', 'Q2', 'Q3', 'Q4', 'Q5', 'Q6', 'Final'],
    datasets: [
      {
        label: 'UChicago SEO score',
        data: [87.0, 88.2, 89.5, 90.8, 91.9, 92.7, 93.8],
        borderColor: '#2a78d6',
        backgroundColor: 'rgba(42,120,214,0.07)',
        borderWidth: 2,
        pointBackgroundColor: '#2a78d6',
        pointBorderColor: '#fff',
        pointBorderWidth: 2,
        pointRadius: 5,
        fill: true,
        tension: 0.4
      },
      {
        label: 'Education industry benchmark',
        data: [83.1, 83.1, 83.1, 83.1, 83.1, 83.1, 83.1],
        borderColor: '#e34948',
        backgroundColor: 'transparent',
        borderWidth: 1.5,
        borderDash: [6, 4],
        pointRadius: 0,
        fill: false
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: (ctx) => ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1)
        }
      }
    },
    scales: {
      y: {
        min: 78,
        max: 98,
        ticks: { stepSize: 5, color: '#8A9BB0', font: { size: 11 } },
        grid: { color: 'rgba(180,178,169,0.2)' },
        border: { display: false }
      },
      x: {
        ticks: { color: '#8A9BB0', font: { size: 11 }, autoSkip: false },
        grid: { display: false },
        border: { display: false }
      }
    }
  }
});
</script>
</body>
</html>
